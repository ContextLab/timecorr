name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Run tests with pytest (without the slow tests)
      run: |
        pytest tests/ -m "not slow" -v --durations=25

    - name: Run docstring examples (doctests)
      run: |
        pytest --doctest-modules timecorr/ -v

  slow:
    runs-on: ubuntu-latest
    env:
      # the runner has 4 cores
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    # tests/test_datasets.py reads the story-listening fit (a 460 MB download)
    - name: Cache the example data
      uses: actions/cache@v4
      with:
        path: ~/timecorr_data
        key: timecorr-data-pieman-870179316f12

    - name: Run the slow tests
      run: |
        pytest tests/ -m slow -v --durations=25
