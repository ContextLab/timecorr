# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  # nbsphinx converts the notebooks' Markdown cells with pandoc
  apt_packages:
    - pandoc

# The tutorial notebooks are rendered from their saved outputs (not executed),
# so the build needs only the package and the "docs" extra.
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
